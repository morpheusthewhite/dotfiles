# ~/.tmux.conf — managed in ~/dotfiles/tmux (stow package)

# ---------------------------------------------------------------- terminal ---
# tmux-256color + RGB passthrough: without this, TUIs (nvim, claude code)
# render in degraded colour.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -g mouse on
set -g history-limit 50000
set -sg escape-time 10          # don't swallow <Esc> in nvim
set -g focus-events on          # let nvim see focus gained/lost
set -g detach-on-destroy off    # killing a session hops to another, not to the shell

# ------------------------------------------------------------------- prefix ---
# Default C-b prefix, deliberately NOT remapped:
#   C-a      stays free for nvim's increment-number
#   C-Space  stays free for nvim cmp completion (plugin/lsp.vim)
#   C-b C-b  sends a literal C-b through to nvim for page-up
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ------------------------------------------------- windows, panes & indexing ---
set -g base-index 1             # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on      # renumber remaining windows when one is closed

# keep hand-set window names (claude/git/build); don't let the shell retitle them
setw -g automatic-rename off
set -g allow-rename off

# split panes using | and -, inheriting the current pane's directory
# fall back to ~ if that directory was deleted, else the new shell dies with
# "getcwd: cannot access parent directories"
bind | if-shell 'test -d "#{pane_current_path}"' 'split-window -h -c "#{pane_current_path}"' 'split-window -h -c ~'
bind - if-shell 'test -d "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"' 'split-window -v -c ~'
bind c if-shell 'test -d "#{pane_current_path}"' 'new-window -c "#{pane_current_path}"' 'new-window -c ~'
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --------------------------------------------------------------- navigation ---
bind s choose-tree -Zs          # zoomed session picker — the cross-project jump
bind a next-window -a           # jump to next window with an alert (bell)
bind BSpace last-window

# ------------------------------------------------------------ bell / alerts ---
# monitor-bell (NOT monitor-activity): activity fires on any output, which for a
# streaming TUI means every window stays permanently lit.
set -g monitor-bell on
setw -g monitor-activity off
set -g bell-action other        # flag bells from windows you're not looking at
set -g visual-bell off

# --------------------------------------------------------- copy mode (vi) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel
bind P paste-buffer
set -g set-clipboard on         # OSC 52, for clipboard over ssh

# ------------------------------------------------------------------- status ---
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

set -g status-style "bg=colour235,fg=colour250"
set -g status-left  " #[bold]#S#[nobold] "
set -g status-left-style "bg=colour238,fg=colour252"
set -g status-left-length 30
set -g status-right "#[fg=colour244]%a %d %b  #[fg=colour252]%H:%M "
set -g status-right-length 40

# While claude runs in a window, show its conversation title (which it sets via
# the terminal title, so #{pane_title}) instead of the window name. Nothing is
# renamed: when claude exits the condition goes false and the real name returns.
# The command is "claude" or, for the node build, a bare version like 2.1.5.
# The regex drops claude's leading status glyph (spinner / idle marker).
set -g @win_name "#{?#{||:#{m:*claude*,#{pane_current_command}},#{m/r:^[0-9]+\\.[0-9]+,#{pane_current_command}}},#{s/^[^A-Za-z0-9]+ //:pane_title},#W}"
setw -g window-status-format         " #I:#{E:@win_name} "
setw -g window-status-current-format " #I:#{E:@win_name} "
setw -g window-status-current-style  "bg=colour24,fg=colour255,bold"
setw -g window-status-bell-style     "bg=colour214,fg=colour232,bold"
setw -g window-status-activity-style "none"

set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour24"
set -g message-style            "bg=colour214,fg=colour232"
